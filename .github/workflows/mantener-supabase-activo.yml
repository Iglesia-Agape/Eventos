# Mantiene activo el proyecto de Supabase (el plan gratuito lo pausa tras ~7 días sin actividad).
# Consulta la API dos veces por semana. Si Supabase no responde, el workflow falla
# y GitHub te envía un correo, así te enteras de inmediato.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 15 * * 1,4'   # lunes y jueves, 15:00 UTC (9:00 a. m. en Honduras)
  workflow_dispatch:          # también se puede ejecutar a mano desde la pestaña Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          URL="${SUPABASE_URL%/}/rest/v1/events?select=id&limit=1"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" "$URL" || true)
            echo "Intento $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Supabase respondió correctamente."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Supabase no respondió con 200. ¿Proyecto pausado, URL o clave incorrectas?"
          exit 1
